    <path d="M 204 195 C 220 178, 236 124, 256 124 C 276 124, 288 200, 304 200 C 312 200, 320 188, 328 174"
          stroke="#6023B6" stroke-width="25" stroke-linecap="round" stroke-linejoin="round" />
    
