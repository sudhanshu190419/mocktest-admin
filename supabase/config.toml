# =============================================================================
# Supabase Project Configuration
#
# This file configures your Supabase project settings.
# For Edge Functions, verify_jwt controls whether the runtime requires a
# valid Supabase JWT Authorization header.
# =============================================================================

[functions.razorpay-webhook]
verify_jwt = false

# Admin Identity — secure admin account creation (super admin only).
# verify_jwt = true (default) so the runtime requires a valid Supabase JWT;
# the function independently verifies the caller is an approved super admin
# using the service role (never trusting client-supplied role values).
[functions.admin-identity-create]
verify_jwt = true

# Subscription Lifecycle — scheduled by pg_cron (Migration 097, Phase 11K.9).
# verify_jwt = false is REQUIRED for the scheduled invocation: the internal
# cron job POSTs to this function over HTTP (net.http_post) without an
# Authorization header. Safe by design: every state transition is date-gated
# (WHERE end_date < today / grace_end_date < today) and executed via atomic
# conditional UPDATEs, and every notification is reference-idempotent — so an
# unauthenticated manual run cannot force early transitions or duplicate
# effects. GET is also allowed for health checks / manual runs.
[functions.subscription-lifecycle]
verify_jwt = false

# Timetable Materialization — scheduled by pg_cron (Migration 110).
# verify_jwt = false is REQUIRED for the scheduled invocation: the internal
# cron job POSTs to this function over HTTP (net.http_post) without an
# Authorization header. Safe by design: materialization is idempotent
# (uq_live_classes_timetable_occurrence + ON CONFLICT DO NOTHING), date-gated
# to a rolling current_date → +60 day window, and only creates 'scheduled'
# future classes within slot validity (holidays/leaves skipped) — an
# unauthenticated manual run cannot corrupt data or create duplicates. GET is
# also allowed for health checks / manual runs.
[functions.timetable-materialization]
verify_jwt = false

# Live Class Watchdog — scheduled by pg_cron (Migration 112).
# verify_jwt = false is REQUIRED for the scheduled invocation: the internal
# cron job POSTs to this function over HTTP (net.http_post) without an
# Authorization header. Safe by design: recovery is service-role-gated inside
# the SECURITY DEFINER RPC (recover_stale_live_classes), date/status-gated to
# stale live or expired-scheduled classes only, and idempotent — an
# unauthenticated manual run cannot end healthy classes or create duplicates.
# GET is also allowed for health checks / manual runs.
[functions.live-class-watchdog]
verify_jwt = false

# Commerce completion functions (complete-course-purchase,
# complete-subscription-purchase, complete-pyq-purchase): verify_jwt = true
# is REQUIRED for the audit-C2 service-role check. These functions decode
# the JWT payload to confirm the caller holds the service-role key, which
# is only safe because the platform validates the JWT signature first.
# Explicit entries make the (already default) setting auditable so an
# accidental verify_jwt = false cannot silently weaken the check.
[functions.complete-course-purchase]
verify_jwt = true

[functions.complete-subscription-purchase]
verify_jwt = true

[functions.complete-pyq-purchase]
verify_jwt = true
