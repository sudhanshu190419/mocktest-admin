    <circle cx="352" cy="56" r="15" fill="#05AD66" />
    
    <!-- Star -->
    <path d="M 416 20 Q 416 42 434 42 Q 416 42 416 64 Q 416 42 398 42 Q 416 42 416 20 Z" fill="#FAB416" />
